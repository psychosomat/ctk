<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ctk — Count of Tokens</title>
  <desc id="hero-desc">ctk counts how many tokens a file costs in an LLM context window. A terminal session shows real output: ctk prompt.md prints 71, cat fib.ts piped to ctk prints 42, and echo hello world piped to ctk prints 3.</desc>

  <rect width="1200" height="330" rx="16" fill="#0B0E14"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="5" fill="#8A94A6">COUNT OF TOKENS</text>
    <text x="-4" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="128" font-weight="700" fill="#E8EDF4">ctk</text>
    <rect x="238" y="108" width="26" height="66" fill="#3FB950"/>
    <text x="0" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#E8EDF4">Token cost of any file. One command.</text>
    <text x="0" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8A94A6">o200k_base · offline · pipeable</text>
  </g>

  <g id="terminal-proof" transform="translate(656 45)">
    <rect width="480" height="240" rx="12" fill="#12161F" stroke="#2A3040" stroke-width="1.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
      <text x="32" y="48"><tspan fill="#3FB950">$</tspan><tspan fill="#E8EDF4" dx="10">ctk prompt.md</tspan></text>
      <text x="32" y="82" font-size="30" font-weight="700" fill="#E3B341">71</text>
      <text x="32" y="118"><tspan fill="#3FB950">$</tspan><tspan fill="#E8EDF4" dx="10">cat fib.ts | ctk</tspan></text>
      <text x="32" y="152" font-size="30" font-weight="700" fill="#E3B341">42</text>
      <text x="32" y="188"><tspan fill="#3FB950">$</tspan><tspan fill="#E8EDF4" dx="10">echo "hello world" | ctk</tspan></text>
      <text x="32" y="222" font-size="30" font-weight="700" fill="#E3B341">3</text>
      <rect x="52" y="194" width="13" height="28" fill="#3FB950"/>
    </g>
  </g>
</svg>
